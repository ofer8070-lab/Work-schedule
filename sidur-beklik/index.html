<!doctype html>
<html lang="he" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="app-version" content="1.4"><title>סידור בקליק - פיילוט</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:system-ui,Arial,sans-serif;background:#f3f7f4;color:#183a2b}header{background:#176b45;color:white;padding:22px 16px}main{max-width:760px;margin:auto;padding:14px}h1{margin:0;font-size:25px}h2{font-size:21px;margin:4px 0 15px}.small{font-size:13px;opacity:.85}.tabs{display:grid;grid-template-columns:repeat(3,1fr);gap:7px;margin:16px 0}button,select,input{font:inherit;touch-action:manipulation}button{border:0;border-radius:12px;padding:13px;cursor:pointer;font-weight:700}button:active{opacity:.7}.tabs button{background:white;color:#176b45}.tabs button.on,.primary{background:#176b45!important;color:white!important}.secondary{background:#e4f0e7;color:#176b45}.card{background:white;border-radius:16px;padding:16px;margin:12px 0;box-shadow:0 2px 9px #152d1910}.panel{display:none}.panel.on{display:block}.row{display:flex;align-items:center;gap:9px;flex-wrap:wrap;margin:10px 0}.row>*{flex:1}select,input{min-height:44px;border:1px solid #c9d9cf;border-radius:9px;padding:8px;background:white;max-width:100%}label{display:block;font-weight:650;margin:12px 0 5px}.day{border-bottom:1px solid #edf1ee;padding:9px 0}.choices{display:grid;grid-template-columns:repeat(4,1fr);gap:5px;margin-top:8px}.choices button{padding:10px 3px;background:#edf4ef;color:#25543a;font-size:13px}.choices button.on{background:#176b45;color:white}.choices button.off{background:#fff0ed;color:#a33828}.choices button.off.on{background:#a33828;color:white}.big{width:100%;margin-top:14px}.note{background:#fff9df;border-radius:10px;padding:10px;font-size:14px}.entry{border-bottom:1px solid #edf2ee;padding:9px 0}.danger{color:#a6382e}.sgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:7px}.sgrid select{min-width:0;width:100%;font-size:13px;padding:4px}.status{margin-top:10px;font-weight:700;color:#176b45}.tiny{font-size:12px;color:#678071}

.schedule-scroll{overflow-x:auto;-webkit-overflow-scrolling:touch;border-radius:12px;border:1px solid #cdd7dd}
.week-table{width:100%;min-width:630px;border-collapse:collapse;table-layout:fixed;text-align:center;direction:rtl}
.week-table th{background:#202e43;color:white;padding:10px 2px;border:2px solid #667184;font-size:clamp(13px,2.5vw,17px)}
.week-table .date-head th{font-size:clamp(12px,2.4vw,16px);padding:7px 2px}
.week-table td{border:2px solid #c6d3dc;padding:4px 2px;font-weight:700}
.week-table .time{font-size:clamp(14px,2.4vw,19px);height:49px;color:#246be3}
.week-table .assign{height:55px}
.week-table .morning{background:#baf2d1}.week-table .evening{background:#ffd6d5}.week-table .night{background:#e6d5f7}
.week-table .missing{background:#ffb2aa}
.week-table select{width:100%;min-height:42px;text-align:center;text-align-last:center;border:none;background:transparent;font-size:clamp(13px,2.4vw,18px);font-weight:750;color:#131e26;padding:2px 0}
.week-table .assign:has(select:focus){outline:2px solid #1b764f}
.week-pager{display:flex;gap:8px;align-items:center;justify-content:space-between;margin:8px 0}
.week-pager button{background:#e4f0e7;color:#176b45}
@media(max-width:450px){main{padding:8px}.card{padding:10px}.week-table{min-width:630px}.tabs button{padding:12px 2px}}
</style></head><body>
<header><h1>📅 סידור בקליק</h1><div class="small">פיילוט 1.4 - הדגמה מקומית</div></header>
<main>
<div class="row"><button class="secondary" id="update">↻ עדכון גירסה</button><span class="tiny" id="updateStatus">גרסה 1.4</span></div>
<div class="tabs"><button data-tab="employee" class="on">👤 עובד</button><button data-tab="manager">🧑‍💼 מנהל</button><button data-tab="settings">⚙️ הגדרות</button></div>
<div class="row"><div><label>עסק / תחנה</label><select id="station"></select></div><div><label>תחילת שבוע</label><input type="date" id="week"></div></div>
<section class="panel on" id="employee"><div class="card"><h2>הבקשות שלי</h2><label>שם העובד</label><select id="worker"></select><p class="tiny">בחר משמרת מועדפת או לא זמין. אי בחירה משמעה שאין העדפה.</p><div id="days"></div><button id="save" class="primary big">✓ שלח בקשות</button><div class="status" id="saved"></div></div></section>
<section class="panel" id="manager"><div class="card"><h2>בקשות העובדים</h2><div id="requests"></div><button id="generate" class="primary big">✨ צור סידור אוטומטי</button><div class="status" id="coverage"></div></div><div class="card"><h2>סידור שבועי</h2><div class="week-pager"><button id="previousWeek">שבוע קודם</button><span id="weekLabel"></span><button id="nextWeek">שבוע הבא</button></div><div id="schedule"></div><button id="publish" class="primary big">✓ אשר ופרסם</button><button id="share" class="secondary big">שתף סידור בוואטסאפ</button><div class="status" id="published"></div></div></section>
<section class="panel" id="settings"><div class="card"><h2>הגדרות עסק</h2><p class="note">גרסת הדגמה בלבד. הנתונים נשמרים בדפדפן זה, לא בענן. אין עדיין כניסת עובדים מאובטחת.</p><label>הוסף עסק</label><div class="row"><input id="newStation" placeholder="שם העסק"><button class="secondary" id="addStation">הוסף</button></div><label>עובדים בתחנה</label><div id="workersList"></div><div class="row"><input id="newWorker" placeholder="שם עובד"><button class="secondary" id="addWorker">הוסף</button></div><label>כמות עובדים בכל משמרת</label><div class="sgrid"><div>בוקר<input type="number" id="need0" min="0" max="10"></div><div>ערב<input type="number" id="need1" min="0" max="10"></div><div>לילה<input type="number" id="need2" min="0" max="10"></div></div><button id="backup" class="secondary big">גיבוי נתונים לקובץ</button></div></section>
</main>
<script>
(function(){
"use strict";
const $=s=>document.getElementById(s),days=['ראשון','שני','שלישי','רביעי','חמישי','שישי','שבת'],shifts=['בוקר','ערב','לילה'];
const initial={stations:[{id:'anavim',name:'ענבים',workers:['שאהר','ענתר','זיאד'],needs:[1,1,1]},{id:'mandel',name:'מנדלבאום',workers:['סופיאן','עסב','נביל','אחמד','קווידר','מודי'],needs:[1,1,1]}],requests:{},plans:{},published:{}};
let data;try{data=JSON.parse(localStorage.getItem('sidur_beklik_v13'))||structuredClone(initial)}catch(e){data=JSON.parse(JSON.stringify(initial))}if(!Array.isArray(data.stations))data=JSON.parse(JSON.stringify(initial));
let station='anavim',draft=Array(7).fill(-1);
const getStation=()=>data.stations.find(s=>s.id===station),key=()=>station+'|'+$('week').value,reqKey=w=>key()+'|'+w;
const save=()=>{try{localStorage.setItem('sidur_beklik_v13',JSON.stringify(data))}catch(e){alert('שגיאת שמירה במכשיר')}};
const safe=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;','\'':'&#39;'}[c]));
const date=d=>{let v=new Date($('week').value+'T12:00:00');v.setDate(v.getDate()+d);return v.toLocaleDateString('he-IL',{day:'2-digit',month:'2-digit'})};
function setTab(tab){document.querySelectorAll('.panel').forEach(x=>x.classList.toggle('on',x.id===tab));document.querySelectorAll('[data-tab]').forEach(x=>x.classList.toggle('on',x.dataset.tab===tab));render()}
document.querySelectorAll('[data-tab]').forEach(b=>b.addEventListener('click',()=>setTab(b.dataset.tab)));
function render(){let s=getStation();$('station').innerHTML=data.stations.map(x=>'<option value="'+safe(x.id)+'">'+safe(x.name)+'</option>').join('');$('station').value=station;
let old=$('worker').value;$('worker').innerHTML=s.workers.map(x=>'<option>'+safe(x)+'</option>').join('');if(s.workers.includes(old))$('worker').value=old;
renderDays();renderManager();renderSettings()}
function renderDays(){let w=$('worker').value;draft=(data.requests[reqKey(w)]||Array(7).fill(-1)).slice();$('saved').textContent='';
$('days').innerHTML=days.map((d,i)=>'<div class="day"><b>יום '+d+'</b> <span class="tiny">'+date(i)+'</span><div class="choices">'+[0,1,2,3].map(n=>'<button data-day="'+i+'" data-choice="'+n+'" class="'+(draft[i]===n?'on ':'')+(n===3?'off':'')+'">'+(n===3?'לא זמין':shifts[n])+'</button>').join('')+'</div></div>').join('');
document.querySelectorAll('[data-day]').forEach(b=>b.addEventListener('click',()=>{let i=+b.dataset.day,n=+b.dataset.choice;draft[i]=draft[i]===n?-1:n;document.querySelectorAll('[data-day="'+i+'"]').forEach(x=>x.classList.toggle('on',+x.dataset.choice===draft[i]))}))}
$('worker').addEventListener('change',renderDays);
$('station').addEventListener('change',()=>{station=$('station').value;render()});
$('week').addEventListener('change',()=>{let d=new Date($('week').value+'T12:00:00');d.setDate(d.getDate()-d.getDay());$('week').value=d.toISOString().slice(0,10);render()});
$('save').addEventListener('click',()=>{let w=$('worker').value;if(!w)return alert('בחר עובד');data.requests[reqKey(w)]=draft.slice();save();$('saved').textContent='✓ הבקשות נשמרו בדפדפן';renderManager()});
function renderManager(){let s=getStation(),n=s.workers.filter(w=>data.requests[reqKey(w)]).length;
$('requests').innerHTML='<p>הגישו בקשות: '+n+' מתוך '+s.workers.length+'</p>'+s.workers.map(w=>'<div class="entry">'+safe(w)+' <span class="tiny">'+(data.requests[reqKey(w)]?'✓ הגיש':'טרם הגיש')+'</span></div>').join('');
let p=data.plans[key()];
$('weekLabel').textContent=date(0)+' - '+date(6);
if(p){
let head='<thead><tr>'+days.map(d=>'<th>'+d+'</th>').join('')+'</tr><tr class="date-head">'+days.map((d,i)=>'<th>'+date(i)+'</th>').join('')+'</tr></thead>';
let body='<tbody>';
for(let j=0;j<3;j++){
body+='<tr>'+days.map(()=>'<td class="time '+['morning','evening','night'][j]+'">'+['6-14','14-22','22-6'][j]+'</td>').join('')+'</tr>';
body+='<tr>'+days.map((d,i)=>{
let slots=p[i][j]||[],missing=slots.some(x=>!x);
let selectors=slots.map((name,k)=>'<select aria-label="'+d+' '+shifts[j]+' עובד '+(k+1)+'" data-d="'+i+'" data-s="'+j+'" data-k="'+k+'"><option value="">חסר עובד</option>'+s.workers.map(w=>'<option '+(w===name?'selected':'')+'>'+safe(w)+'</option>').join('')+'</select>').join('');
return '<td class="assign '+['morning','evening','night'][j]+(missing?' missing':'')+'">'+(selectors||'<span class="tiny">אין תקן</span>')+'</td>'
}).join('')+'</tr>';
}
body+='</tbody>';
$('schedule').innerHTML='<div class="schedule-scroll"><table class="week-table">'+head+body+'</table></div><p class="tiny">לשינוי שיבוץ, לחץ על שם העובד בטבלה. במכשיר צר, ניתן להחליק את הטבלה לצדדים.</p>';
}else{$('schedule').innerHTML='<p>עדיין לא נוצר סידור. לחץ על "צור סידור אוטומטי".</p>'}
document.querySelectorAll('[data-d]').forEach(el=>el.addEventListener('change',()=>{let d=+el.dataset.d,j=+el.dataset.s,k=+el.dataset.k,choice=el.value,p=data.plans[key()];if(choice&&p[d].some((a,si)=>a.some((w,ki)=>w===choice&&(si!==j||ki!==k)))){alert('לא ניתן לשבץ אותו עובד פעמיים באותו יום');renderManager();return}p[d][j][k]=choice;save();renderManager()}));
$('coverage').textContent=p?'משמרות ללא שיבוץ: '+p.flat(2).filter(x=>!x).length:''}
$('generate').addEventListener('click',()=>{let s=getStation(),counts=Object.fromEntries(s.workers.map(w=>[w,0])),plan=[];for(let d=0;d<7;d++){let used=new Set(),row=[];for(let j=0;j<3;j++){let slots=[];for(let k=0;k<s.needs[j];k++){let options=s.workers.filter(w=>!used.has(w)&&(data.requests[reqKey(w)]||[])[d]!==3).sort((a,b)=>{let ra=(data.requests[reqKey(a)]||[])[d],rb=(data.requests[reqKey(b)]||[])[d];return Number(rb===j)-Number(ra===j)||counts[a]-counts[b]});let w=options[0]||'';slots.push(w);if(w){used.add(w);counts[w]++}}row.push(slots)}plan.push(row)}data.plans[key()]=plan;save();renderManager()});
function output(){let p=data.plans[key()];if(!p)return '';return 'סידור בקליק - '+getStation().name+'\nשבוע '+$('week').value+'\n'+p.map((r,d)=>days[d]+' '+date(d)+'\n'+r.map((slots,j)=>shifts[j]+': '+(slots.filter(Boolean).join(', ')||'חסר')).join('\n')).join('\n\n')}
function moveWeek(delta){let dt=new Date($('week').value+'T12:00:00');dt.setDate(dt.getDate()+7*delta);$('week').value=dt.getFullYear()+'-'+String(dt.getMonth()+1).padStart(2,'0')+'-'+String(dt.getDate()).padStart(2,'0');render()}
$('previousWeek').addEventListener('click',()=>moveWeek(-1));
$('nextWeek').addEventListener('click',()=>moveWeek(1));
$('publish').addEventListener('click',()=>{if(!data.plans[key()])return alert('קודם צור סידור');data.published[key()]=true;save();$('published').textContent='✓ הסידור אושר בדפדפן הזה. לשיתוף לחץ על שתף.'});
$('share').addEventListener('click',async()=>{let txt=output();if(!txt)return alert('קודם צור סידור');if(navigator.share){try{await navigator.share({text:txt});return}catch(e){}}window.open('https://wa.me/?text='+encodeURIComponent(txt),'_blank')});
function renderSettings(){let s=getStation();$('workersList').innerHTML=s.workers.map((w,i)=>'<div class="entry">'+safe(w)+' <button class="secondary danger" data-del="'+i+'">הסר</button></div>').join('');document.querySelectorAll('[data-del]').forEach(b=>b.addEventListener('click',()=>{if(!confirm('להסיר עובד?'))return;s.workers.splice(+b.dataset.del,1);save();render()}));s.needs.forEach((v,i)=>$('need'+i).value=v)}
$('addStation').addEventListener('click',()=>{let n=$('newStation').value.trim();if(!n)return;station='s'+Date.now();data.stations.push({id:station,name:n,workers:[],needs:[1,1,1]});$('newStation').value='';save();render()});
$('addWorker').addEventListener('click',()=>{let n=$('newWorker').value.trim();if(!n||getStation().workers.includes(n))return;getStation().workers.push(n);$('newWorker').value='';save();render()});
[0,1,2].forEach(i=>$('need'+i).addEventListener('change',()=>{getStation().needs[i]=Math.max(0,Math.min(10,Number($('need'+i).value)||0));save();renderSettings()}));
$('backup').addEventListener('click',()=>{let a=document.createElement('a'),url=URL.createObjectURL(new Blob([JSON.stringify(data)],{type:'application/json'}));a.href=url;a.download='sidur-beklik-backup.json';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)});
$('update').addEventListener('click',()=>{let u=new URL(window.location.href);u.searchParams.set('v',Date.now());window.location.assign(u.href)});
let today=new Date();today.setDate(today.getDate()-today.getDay()+7);$('week').value=today.getFullYear()+'-'+String(today.getMonth()+1).padStart(2,'0')+'-'+String(today.getDate()).padStart(2,'0');render();
})();
</script></body></html>
