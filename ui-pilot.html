<!doctype html><html lang="he" dir="rtl"><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>סידור עבודה | פיילוט</title><style>*{box-sizing:border-box}body{margin:0;background:#f0f4f8;color:#172c43;font:16px Arial}main{max-width:720px;margin:auto;padding:12px}header{display:flex;align-items:center;justify-content:space-between}h2{margin:12px 0}small{color:#65758a}button,select{font:inherit;border:1px solid #dce4ed;background:white;border-radius:10px;padding:10px;color:inherit;cursor:pointer}button.primary{background:#174b80;color:white;border:0;width:100%;margin-top:12px}.row{display:flex;gap:8px;align-items:center;justify-content:space-between;margin:12px 0}.row>*{flex:1;text-align:center}.stats div{background:white;border-radius:12px;padding:12px 2px;box-shadow:0 2px 8px #16324a0a}.stats b{display:block;font-size:25px;margin-top:5px}table{width:100%;border-spacing:4px;table-layout:fixed}th,td{text-align:center;border-radius:8px;padding:9px 2px;font-size:14px}th{color:white;background:#65758a}th:nth-child(2){background:#397b9e}th:nth-child(3){background:#ad7525}th:nth-child(4){background:#34466d}td:first-child{background:#e6edf5;font-weight:bold}td:nth-child(2){background:#dceefa}td:nth-child(3){background:#fff0d5}td:nth-child(4){background:#e4e5f4}td select{width:100%;border:0;background:transparent;padding:7px 0;font-size:14px}td small{display:block}.panel{background:white;border-radius:15px;padding:10px;margin-top:12px}.bar{height:7px;background:#e6edf5;border-radius:8px;flex:2}.bar i{display:block;height:100%;background:#397b9e;border-radius:8px}.active{background:#174b80;color:white}footer{text-align:center;margin:16px;color:#65758a;font-size:12px}</style><main><header><h2>סידור עבודה</h2><small>פיילוט 01</small></header><div class="row"><button id="manager" class="active">מנהל</button><button id="worker">עובד</button></div><select id="station" style="width:100%"><option>תחנת ענבים</option><option>תחנת מנדלבאום</option></select><div class="row"><button id="prev">❯</button><b id="week"></b><button id="next">❮</button></div><div class="row stats" id="stats"><div><small>תקן שעות</small><b>168</b></div><div><small>שיבוץ בפועל</small><b id="actual" style="color:#16805a"></b></div><div><small>חוסר שעות</small><b id="missing" style="color:#c13e39"></b></div></div><div class="panel"><table><thead><tr><th>יום</th><th>בוקר<br>06–14</th><th>צהריים<br>14–22</th><th>לילה<br>22–06</th></tr></thead><tbody id="grid"></tbody></table></div><button class="primary" id="auto">✦ הכנת סידור אוטומטי (הדגמה)</button><div class="panel" id="summary"></div><footer>נתוני דוגמה בלבד • ללא חיבור למערכת הפעילה</footer></main><script>const $=id=>document.getElementById(id),days=['א׳','ב׳','ג׳','ד׳','ה׳','ו׳','שבת'],groups=[['עובד א','עובד ב','עובד ג','עובד ד'],['עובד א','עובד ב','עובד ג','עובד ד','עובד ה']];let offset=0,manager=true,store={};function names(){return groups[$('station').selectedIndex]}function key(){return $('station').selectedIndex+':'+offset}function cells(){return store[key()]??(store[key()]=Array(21).fill(''))}function date(d){let x=new Date(2026,10,29+offset*7+d);return x.toLocaleDateString('he-IL',{day:'2-digit',month:'2-digit'})}function render(){$('week').textContent=date(0)+' - '+date(6);$('grid').replaceChildren();for(let d=0;d<7;d++){let tr=document.createElement('tr');let t=tr.insertCell();t.textContent=days[d];let sm=document.createElement('small');sm.textContent=date(d);t.append(sm);for(let s=0;s<3;s++){let i=d*3+s,td=tr.insertCell(),sel=document.createElement('select');for(let n of ['',...names()])sel.add(new Option(n||'+',n));sel.value=cells()[i];sel.disabled=!manager;sel.onchange=()=>{if(sel.value&&cells().slice(d*3,d*3+3).some((v,j)=>j!==s&&v===sel.value)){alert('עובד כבר משובץ ביום זה');sel.value=cells()[i];return}cells()[i]=sel.value;totals()};td.append(sel)}$('grid').append(tr)}$('auto').hidden=!manager;$('stats').hidden=!manager;totals()}function totals(){let a=cells().filter(Boolean).length*8;$('actual').textContent=a;$('missing').textContent=168-a;$('summary').innerHTML='<b>סיכום שעות עובדים</b>'+names().map(n=>{let h=cells().filter(v=>v===n).length*8;return '<div class="row"><span>'+n+'</span><div class="bar"><i style="width:'+Math.min(100,h/56*100)+'%"></i></div><span>'+h+' שעות</span></div>'}).join('')}$('auto').onclick=()=>{let ns=names();store[key()]=Array.from({length:21},(_,i)=>ns[(Math.floor(i/3)+i%3)%ns.length]);render()};$('station').onchange=render;$('prev').onclick=()=>{offset--;render()};$('next').onclick=()=>{offset++;render()};$('manager').onclick=()=>{manager=true;$('manager').classList.add('active');$('worker').classList.remove('active');render()};$('worker').onclick=()=>{manager=false;$('worker').classList.add('active');$('manager').classList.remove('active');render()};$('auto').click();</script></html>
